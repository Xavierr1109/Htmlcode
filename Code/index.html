<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confession Scene</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Character -->
    <img src="male.png" class="character" id="character">

    <audio id="bgm" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Dialogue UI -->
    <div class="game-ui">

        <div class="name-box">
            Xavier 
        </div>

        <div class="dialogue-box">
            <span id="text"></span>
        </div>

        <button onclick="nextDialogue()">▶ Continue</button>

    </div>

    <div id="hearts-container"></div>

    <script src="script.js"></script>

</body>
</html>
